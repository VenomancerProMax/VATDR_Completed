<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete VAT De-Registration</title>
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="form-container">
        <button class="close-button" onclick="closeWidget()">×</button>
        <form id="record-form" novalidate>
            <label>Certificate of VAT De-Registration <span style="color: red;">*</span></label>
            <div id="drop-zone">
                <span id="file-label-text">Click or drag & drop PDF/Image</span>
                <input type="file" id="cert-vat-de-registration" class="hidden" accept=".pdf,.jpg,.jpeg,.png">
            </div>
            <span class="error-message" id="error-cert-vat-de-registration"></span>

            <label for="effective-de-registration-date">Effective De-registration Date <span style="color: red;">*</span></label>
            <input type="date" id="effective-de-registration-date" required />
            <span class="error-message" id="error-effective-de-registration-date"></span>

            <label for="reason-de-registration">Reason for De-registration <span style="color: red;">*</span></label>
            <textarea id="reason-de-registration" rows="4" placeholder="Enter reason for de-registration"></textarea>
            <span class="error-message" id="error-reason-de-registration"></span>

            <button class="submit-button" type="submit" id="submit_button_id">Submit</button>
        </form>
    </div>

    <div id="upload-buffer" class="upload-overlay hidden">
        <div class="upload-box">
            <div class="upload-icon">⬆️</div>
            <div class="upload-title">Uploading...</div>
            <div class="progress-bar-background">
                <div id="upload-progress" class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Toast notification (replaces the old blocking modal) -->
    <div id="toast" class="hidden">
        <div id="toast-icon">✅</div>
        <div class="toast-content">
            <p id="toast-title"></p>
            <p id="toast-message"></p>
        </div>
        <div class="toast-progress-track">
            <div id="toast-progress-bar"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
